aid: boost
name: Boost
description: >-
  Boost is a distributed onchain incentives network that lets any team reward any
  onchain action with any token. Teams define target actions, fund a budget, and
  deploy campaigns across Base, Optimism, Arbitrum and other EVM chains, then
  measure ROI and iterate in real time. Boost ships two products — One-Time Actions
  and Time-Based Incentives (TBI) — plus RewardKit and a Headless SDK for embedding
  reward primitives, a public read-only Boost V2 REST API, a TypeScript SDK, a CLI,
  and a published MCP server. Founded by Ido Ben-Natan and Raz Niv and backed by
  Electric Capital and Greylock.
