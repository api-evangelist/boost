  /signatures:
    get:
      tags:
      - Boost
      operationId: getSignatures
      summary: Generate a claim signature that can be used to submit a claim
      description: Given a tx hash, id, and valid claim data hash, generate a valid signature that can be used to claim a reward on chain.
      parameters:
      - schema:
          type: string
          description: Transaction hash of transaction that satisfies a reward's action that unlocks claim rewards.
        required: true
        description: Hex in format 0x[0-9a-fA-F]{64}
        in: query
        name: txHash
      - schema:
          type: string
          description: System reward ID in the format chainId:boostCoreAddress:identifier
          example: 8453:0x378632819f39c74c4f56b1429e760739c5fb51b7:1
        required: true
        description: BoostID in format chainId:boostCoreAddress:identifier
        in: query
        name: boostId
      - schema:
          description: Additional encoded claim data to submit along with the transaction for a claim
        required: false
        name: claimData
        in: query
      responses:
        '200':
          description: Successfully generated a claim signature
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    signature:
                      type: string
                      description: Claim signature that can be used with the Boost Protocol V2's claim/claimIncentiveFor methods
                    claimant:
                      type: string
                      description: The address for the user making the claim
                      example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                      pattern: ^0x[a-fA-F0-9]{40}$
                    referrer:
                      type: string
                      description: The address of the referrer
                      example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                      pattern: ^0x[a-fA-F0-9]{40}$
                    incentiveId:
                      type: number
                      description: The index of the incentive being claimed, typically 0
                  required:
                  - signature
                  - claimant
                  - referrer
                  - incentiveId
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        message:
                          type: string
                          description: Human readable message for error that occured
                        code:
                          type: number
                          description: Error code for error that occured, will typically be the HTTP status code
                      required:
                      - message
                    description: A generic error object that can be used to represent any error that occurs in the system.
                required:
                - error
        '404':
          description: Reward not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        message:
                          type: string
                          description: Human readable message for error that occured
                        code:
                          type: number
                          description: Error code for error that occured, will typically be the HTTP status code
                      required:
                      - message
                    description: A generic error object that can be used to represent any error that occurs in the system.
                required:
                - error
        '410':
          description: Reward is not active
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        message:
                          type: string
                          description: Human readable message for error that occured
                        code:
                          type: number
                          description: Error code for error that occured, will typically be the HTTP status code
                      required:
                      - message
                    description: A generic error object that can be used to represent any error that occurs in the system.
                required:
                - error
        '500':
          description: Upstream server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        message:
                          type: string
                          description: Human readable message for error that occured
                        code:
                          type: number
                          description: Error code for error that occured, will typically be the HTTP status code
                      required:
                      - message
                    description: A generic error object that can be used to represent any error that occurs in the system.
                required:
                - error
  /signatures/claimable/{address}:
    get:
      tags:
      - Boost
      operationId: getClaimableSignatures
      summary: Get claimable signatures for an address
      description: Returns all signatures for an address that have not yet been used to claim their associated boost.
      parameters:
      - schema:
          type: string
          description: The wallet address to find claimable signatures for
          example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
          pattern: ^0x[a-fA-F0-9]{40}$
        required: true
        in: path
        name: address
      responses:
        '200':
          description: Claimable signatures for the given address
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    boostId:
                      type: string
                      description: The boost ID associated with the signature
                      example: 8453:0x378632819f39c74c4f56b1429e760739c5fb51b7:1
                    signature:
                      type: string
                      description: Claim signature that can be used with the Boost Protocol V2 claim methods
                    claimant:
                      type: string
                      description: The address for the user making the claim
                      example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                      pattern: ^0x[a-fA-F0-9]{40}$
                    incentiveId:
                      type: number
                      description: The index of the incentive being claimed
                    referrer:
                      type: string
                      description: The address of the referrer
                      example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                      pattern: ^0x[a-fA-F0-9]{40}$
                  required:
                  - boostId
                  - signature
                  - claimant
                  - incentiveId
                  - referrer
  /boosts:
    get:
      operationId: getBoosts
      summary: Get a list of Boosts
      description: Accepts pagination, and filter options to return a list of boosts
      tags:
      - Boost
      parameters:
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          default: 1
          description: The desired page to return from the query
        required: false
        in: query
        name: page
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          default: 10
          description: The amount of items to return from the query, defaults to 10, and must be <= 100
        required: false
        in: query
        name: pageSize
      - schema:
          type: string
          description: Filter boosts by budget account address(es). Accepts a single address or comma-separated list of addresses
          example: 0x378632819f39c74c4f56b1429e760739c5fb51b7,0x1234567890123456789012345678901234567890
        required: false
        in: query
        name: budgetAccount
      - schema:
          type: string
          description: Filter boosts by a specific owner address
          example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
          pattern: ^0x[a-fA-F0-9]{40}$
        required: false
        in: query
        name: owner
      - schema:
          type: string
          description: Filter boosts by a specific autoboost ID
        required: false
        in: query
        name: autoboostId
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Only retrieve Boosts for a specific chain ID. You must supply this parameter if also specifying `targetContract`
        required: false
        in: query
        name: chainId
      - schema:
          type: string
          description: Retrieve rewards configured with actions that target a specific contract i.e., Zora's address for all rewards that require a mint in order to claim a reward. If you supply this parameter, you must also supply chainId
          example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
          pattern: ^0x[a-fA-F0-9]{40}$
        required: false
        in: query
        name: targetContract
      - schema:
          type: string
          description: Retrieve rewards configured with specific token addresses
          example: chainId:tokenAddress,chainId:tokenAddress:collection,...
        required: false
        in: query
        name: tokens
      - schema:
          type: string
          description: Filter boosts by comma separated list of distribution channels
          example: distributionChannel=public,farcaster
        required: false
        in: query
        name: distributionChannel
      - schema:
          type: string
          enum:
          - active
          - recently-deployed
          description: Sort by active or recently deployed
        required: false
        in: query
        name: sortBy
      - schema:
          type:
          - boolean
          - 'null'
          default: true
          description: Filter boosts by token whitelist
        required: false
        in: query
        name: tokenWhitelist
      - schema:
          type: string
          description: Is the Boost action template only, or has a more customized action configuration
        required: false
        name: actionTemplateOnly
        in: query
      - schema:
          type: string
          description: Is the Boost active only, or has a more customized action configuration
        required: false
        name: showActiveOnly
        in: query
      responses:
        '200':
          description: Returns a list of Boosts
          content:
            application/json:
              schema:
                type: object
                properties:
                  boosts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: System ID in the format chainId:boostCoreAddress:identifier
                          example: 8453:0x378632819f39c74c4f56b1429e760739c5fb51b7:1
                        action:
                          type: string
                          description: The address of the action
                          example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                          pattern: ^0x[a-fA-F0-9]{40}$
                        allowList:
                          type:
                          - object
                          - 'null'
                          properties:
                            owner:
                              type: string
                              description: The owner of the allow list, who can modify allowed users
                              example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                              pattern: ^0x[a-fA-F0-9]{40}$
                            contractAddress:
                              type: string
                              description: The contract address of the allow list
                              example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                              pattern: ^0x[a-fA-F0-9]{40}$
                            type:
                              type: string
                              enum:
                              - SimpleAllowList
                              - SimpleDenyList
                              - OpenAllowList
                              - OffchainAccessList
                              description: The type of the allow list
                            addresses:
                              type:
                              - array
                              - 'null'
                              items:
                                type: string
                                description: Ethereum address
                                example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                                pattern: ^0x[a-fA-F0-9]{40}$
                              description: List of addresses allowed or denied
                          required:
                          - owner
                          - contractAddress
                          - type
                          description: An object containing information on who is elligible to claim incentives
                        boostIndex:
                          type: string
                          description: The index of the Boost
                        budget:
                          type: string
                          description: The address of the backing budget contract
                          example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                          pattern: ^0x[a-fA-F0-9]{40}$
                        incentiveCount:
                          type: string
                          description: The total number of incentives attached to the Boost
                        owner:
                          type: string
                          description: The owner of the Boost
                          example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                          pattern: ^0x[a-fA-F0-9]{40}$
                        validator:
                          type: string
                          description: The address of the validator who can sign claim payloads
                          example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                          pattern: ^0x[a-fA-F0-9]{40}$
                        blockTimestamp:
                          type: string
                          description: The timestamp of the block in which the Boost was created
                        txHash:
                          type: string
                          description: The hash of the transaction that created the Boost
                        chainId:
                          type: integer
                          description: The ID of the chain on which the Boost was created
                        actionSteps:
                          type:
