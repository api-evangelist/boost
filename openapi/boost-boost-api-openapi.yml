                          items:
                            type: object
                            properties:
                              chainId:
                                type: integer
                                description: ''
                              claimant:
                                type: string
                                description: ''
                                example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                                pattern: ^0x[a-fA-F0-9]{40}$
                              signature:
                                type: string
                                description: ''
                              signatureName:
                                type: string
                                description: ''
                              signatureType:
                                type: string
                                enum:
                                - event
                                - function
                                description: ''
                              actionType:
                                type: number
                                description: ''
                              targetContract:
                                type: string
                                description: ''
                                example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
                                pattern: ^0x[a-fA-F0-9]{40}$
                              parameters:
                                type: object
                                properties:
                                  filterType:
                                    type: number
                                    description: ''
                                  fieldType:
                                    type: number
                                    description: ''
                                  fieldIndex:
                                    type: number
                                    description: ''
                                  filterData:
                                    type: string
                                    description: ''
                                required:
                                - filterType
                                - fieldType
                                - fieldIndex
                                - filterData
                                description: ''
                            required:
                            - chainId
                            - signature
                            - signatureName
                            - signatureType
                            - actionType
                            - targetContract
                            - parameters
                          description: A list of action steps associated with the Boost that must be completed before the Boost's incentives can be claimed
                        protocolFee:
                          type: string
                          description: A BigInt representing fees to collect on value distribution
                        maxParticipants:
                          type: string
                          description: Maximum amount of participants allowed
                        incentives:
                          type: array
                          items:
