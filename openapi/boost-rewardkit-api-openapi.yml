  /reward-kit/boosts/:id:
    get:
      operationId: getRewardKitReward
      summary: Get a single RewardKit reward
      description: Retrieve details on a reward, optionally providing a claimant address to decorate with additional claim context.
      tags:
      - RewardKit
      parameters:
      - schema:
          type: string
          description: The ID of the reward to fetch details for.
          example: 8453:0x378632819f39c74c4f56b1429e760739c5fb51b7:1
        required: true
        description: BoostID in format chainId:boostCoreAddress:identifier
        in: path
        name: id
      - schema:
          type: string
          description: If included, the address of a specific claimant to enrich data with claim information, like claimed, claimable, and tx hash for eligible claim.
          example: '0x378632819f39c74c4f56b1429e760739c5fb51b7'
          pattern: ^0x[a-fA-F0-9]{40}$
        required: false
        name: address
        in: query
      - schema:
          type:
          - boolean
          - 'null'
          description: Include token metadata (price, market cap, etc.) for applicable actions. Defaults to false.
          example: true
        required: false
        name: includeTokenMetadata
        in: query
      responses:
        '200':
          description: Returns single RewardKit reward
          content:
            application/json:
              schema:
                type: object
                properties:
                  boost:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The reward identifier in the form of "chainId:boostCoreAddress:identifier"
                        example: 8453:0x378632819f39c74c4f56b1429e760739c5fb51b7:1
                      chainId:
                        type: number
                        description: The chain id of the network where the reward is being offered
                      incentives:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - AllowListIncentive
                              - CGDAIncentive
                              - ERC20Incentive
                              - PointsIncentive
                              - ERC20VariableIncentive
                              - ERC20VariableCriteriaIncentive
                              - ERC20VariableCriteriaIncentiveV2
                              - ERC20PeggedIncentive
                              - ERC20PeggedVariableCriteriaIncentive
                              - ERC20PeggedVariableCriteriaIncentiveV2
                              description: Human readable label for the incentive type
                            assetAddress:
                              type: string
                              description: Address of the asset being rewarded
